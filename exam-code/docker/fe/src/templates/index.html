<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Price Tracker</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #17233c;
            background: #f3f6fb;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        .shell { max-width: 900px; margin: 0 auto; padding: 60px 24px; }
        .eyebrow { color: #3972b5; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 12px 0 10px; font-size: clamp(32px, 5vw, 48px); letter-spacing: -.04em; }
        .intro { max-width: 600px; margin: 0; color: #53617a; line-height: 1.6; }
        .panel { margin-top: 34px; padding: 28px; background: #fff; border: 1px solid #dfe6f0; border-radius: 18px; box-shadow: 0 16px 40px rgba(25, 48, 87, .06); }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
        h2 { margin: 0; font-size: 20px; }
        button { border: 0; border-radius: 10px; background: #1769aa; color: #fff; padding: 12px 18px; font: inherit; font-weight: 650; cursor: pointer; }
        button:hover { background: #0f568f; }
        button:disabled { opacity: .6; cursor: wait; }
        button:focus-visible { outline: 3px solid #8bc5ff; outline-offset: 3px; }
        .status { min-height: 23px; margin: 19px 0 0; color: #53617a; font-size: 14px; }
        .status.error { color: #a63131; }
        .prices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 22px; }
        .price-card { padding: 20px; border: 1px solid #dfe6f0; border-radius: 12px; background: #fbfcfe; }
        .coin { margin: 0 0 8px; color: #53617a; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
        .amount { margin: 0 0 16px; font-size: clamp(24px, 3vw, 31px); font-weight: 700; letter-spacing: -.03em; }
        .saved { margin: 0; font-size: 14px; font-weight: 600; }
        .saved.ok { color: #187044; }
        .saved.fail { color: #a63131; }
        .note { margin: 21px 0 0; color: #64718a; font-size: 13px; line-height: 1.5; }
        @media (max-width: 620px) {
            .shell { padding: 36px 16px; }
            .panel { padding: 20px; }
            .prices { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <div class="eyebrow">Docker &amp; Kubernetes lab</div>
        <h1>Crypto Price Tracker</h1>
        <p class="intro">Fetch the latest Bitcoin and XRP prices, then check that each price was saved in MySQL.</p>

        <section class="panel" aria-labelledby="prices-heading">
            <div class="panel-head">
                <h2 id="prices-heading">Latest prices</h2>
                <button id="fetch-button" type="button">Fetch prices</button>
            </div>
            <p id="status" class="status" role="status" aria-live="polite">Select “Fetch prices” to load current data.</p>
            <div id="prices" class="prices"></div>
            <p class="note">The frontend calls the backend API; the backend retrieves prices and writes them to the database.</p>
        </section>
    </main>
    <script>
        const button = document.getElementById('fetch-button');
        const status = document.getElementById('status');
        const prices = document.getElementById('prices');
        const money = new Intl.NumberFormat('en-US', {
            style: 'currency', currency: 'USD', maximumFractionDigits: 4
        });

        function showPrice(entry) {
            const card = document.createElement('article');
            card.className = 'price-card';
            const coin = document.createElement('p');
            coin.className = 'coin';
            coin.textContent = entry.coin.toUpperCase();
            const amount = document.createElement('p');
            amount.className = 'amount';
            amount.textContent = money.format(entry.price);
            const saved = document.createElement('p');
            saved.className = 'saved ' + (entry.saved ? 'ok' : 'fail');
            saved.textContent = 'Saved to database: ' + String(entry.saved);
            card.append(coin, amount, saved);
            return card;
        }

        async function fetchPrices() {
            button.disabled = true;
            status.className = 'status';
            status.textContent = 'Fetching prices…';
            try {
                const response = await fetch('/fetch_price');
                const data = await response.json();
                if (!response.ok || !Array.isArray(data) || data.length === 0) {
                    throw new Error(data.error || 'No prices were returned.');
                }
                prices.replaceChildren(...data.map(showPrice));
                status.textContent = 'Updated ' + new Date().toLocaleString('en-US');
            } catch (error) {
                prices.replaceChildren();
                status.className = 'status error';
                status.textContent = error.message || 'Could not fetch prices.';
            } finally {
                button.disabled = false;
            }
        }

        button.addEventListener('click', fetchPrices);
    </script>
</body>
</html>
